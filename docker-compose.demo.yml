services:
  postgres:
    image: postgres:16
    container_name: demo-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: irrbb
    ports:
      - "5432:5432"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d irrbb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: demo-redis
    ports:
      - "6379:6379"

  demo-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-runner
    command: python -m scripts.demo_pipeline
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg://user:pass@postgres:5432/irrbb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  demo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg://user:pass@postgres:5432/irrbb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  demo_pgdata: